{# Dashboard-Kachel: Browsersteuerung. #}
<div class="card h-100">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>{{ texts['tile_browser'] }}</span>
        <span class="badge
            {% if browser_status == 'running' %}text-bg-success
            {% elif browser_status in ('error', 'crashed') %}text-bg-danger
            {% else %}text-bg-secondary{% endif %}">
            {{ texts['browser_status_' ~ browser_status] }}
        </span>
    </div>
    <div class="card-body">
        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        {% if message %}
        <div class="alert alert-success" role="alert">{{ message }}</div>
        {% endif %}
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-success"
                    hx-post="{{ url_for('browser.control', action='start') }}"
                    hx-target="#browser-tile">
                {{ texts['btn_start'] }}
            </button>
            <button type="button" class="btn btn-danger"
                    hx-post="{{ url_for('browser.control', action='stop') }}"
                    hx-target="#browser-tile">
                {{ texts['btn_stop'] }}
            </button>
            <button type="button" class="btn btn-primary"
                    hx-post="{{ url_for('browser.control', action='restart') }}"
                    hx-target="#browser-tile">
                {{ texts['btn_restart'] }}
            </button>
        </div>
    </div>
</div>
