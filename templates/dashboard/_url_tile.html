{# Dashboard-Kachel: Kiosk-URL testen und speichern. #}
<div class="card h-100">
    <div class="card-header">{{ texts['tile_url'] }}</div>
    <div class="card-body">
        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        {% if message %}
        <div class="alert alert-success" role="alert">{{ message }}</div>
        {% endif %}
        <form>
            <div class="mb-3">
                <label class="form-label" for="kiosk-url-input">{{ texts['label_kiosk_url'] }}</label>
                <input class="form-control" type="url" id="kiosk-url-input" name="url"
                       placeholder="https://" autocomplete="off"
                       value="{{ entered_url if entered_url is defined else url }}">
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-primary"
                        hx-post="{{ url_for('settings.url_test') }}"
                        hx-include="closest form"
                        hx-target="#url-tile">
                    {{ texts['btn_test'] }}
                </button>
                <button type="button" class="btn btn-primary"
                        hx-post="{{ url_for('settings.url_save') }}"
                        hx-include="closest form"
                        hx-target="#url-tile">
                    {{ texts['btn_save'] }}
                </button>
            </div>
        </form>
    </div>
</div>
