{# Dashboard-Kachel: Neustart und Herunterfahren. #}
<div class="card h-100">
    <div class="card-header">{{ texts['tile_system'] }}</div>
    <div class="card-body">
        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        {% if message %}
        <div class="alert alert-warning" role="alert">{{ message }}</div>
        {% endif %}
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-warning"
                    hx-post="{{ url_for('system.control', action='reboot') }}"
                    hx-target="#system-tile"
                    hx-confirm="{{ texts['confirm_reboot'] }}">
                {{ texts['btn_reboot'] }}
            </button>
            <button type="button" class="btn btn-danger"
                    hx-post="{{ url_for('system.control', action='shutdown') }}"
                    hx-target="#system-tile"
                    hx-confirm="{{ texts['confirm_shutdown'] }}">
                {{ texts['btn_shutdown'] }}
            </button>
        </div>
    </div>
</div>
